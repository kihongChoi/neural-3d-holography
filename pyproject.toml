[project]
name = "neural-3d-holography-benchtop"
version = "0.1.0"
description = "Single-plane camera-in-the-loop experiments for the LETO-3 / Blackfly S bench"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.26,<2",
    "torch>=2.5,<2.6",
    "opencv-python-headless>=4.8,<4.12",
    "pyside6>=6.6",
    "pillow>=10",
    "scipy>=1.11",
    "matplotlib>=3.8,<3.11",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
